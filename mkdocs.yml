site_name: Prajwal's  Wiki
site_url: https://pj1911.github.io/my-wiki/

theme:
  name: material
  custom_dir: overrides
  logo: assets/profile-face.jpg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips

nav:
  - Home: index.md
  - Machine Learning:
      - Linear Regression: linearRegression.md
      - Generative Adversarial Networks: Generative Adversarial Networks.md
      - Transformers:
          - 1 – Introduction: Transformers-1-Introduction.md
          - 2 – Natural Language Processing: Transformers-2-NLP.md
          - 3 – Transformer Language Models: Transformers-3-LLMs.md
          - 4 – Multimodal Transformers: Transformers-4-MMT.md
          - 5 – Kronecker-Structured Attention: Transformers-5-KSA.md
      - Retrieval-Augmented Generation (RAG): Retrieval-Augmented Generation.md
  - Mathematics:
        - Fuzzy Inference Systems: Fuzzy Inference Systems.md
        - Neural network methods for partial differential equations:
          - 1 - Hamilton Jacobi Equation: Hamilton-Jacobi equations.md
          - 2 - Weak solutions: Hyperbolic PDEs-1-weak solutions.md
          - 3 - Entropy Stable and Hyperbolic Solutions: Hyperbolic PDEs-2-Conservation laws and entropy form.md
          - 4 - Neural Operators with localized integral and differential kernels: Neural operators with localized integral and differential kernels.md
        - Numerical methods for hyperbolic conservation laws:
          - 1 - Wavefront Tracking Algorithm: Wavefront Tracking Algorithm.md
  - Reinforcement Learning:
      - 1 - Introduction: RL-1-Introduction.md
      - 2 - Markov Decision Processes: RL-2-Markov Decision Processes.md
      - 3 - Partially Observable MDP: RL-3-Partially Observable MDP.md
      - 4 - Planning with Dynamic Programming: RL-4-Planning with Dynamic Programming.md
      - 5 - Model Free Prediction: RL-5-Model free prediction.md
      - 6 - Model Free Control: RL-6-Model free control.md
      - 7 - Value Function Approximation: RL-7-Value function approximation.md
  - Traffic Flow:
        - ARZ model: Aw–Rascle–Zhang model.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=In39Q2MAAAAJ&hl=en
      name: Google Scholar
    - icon: fontawesome/brands/github
      link: https://github.com/pj1911
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/prajwal-chauhan-81b86b204
      name: LinkedIn
    - icon: material/email-outline
      link: mailto:pc3377@nyu.edu
      name: Email
  # Home page hero (overrides/partials/home-hero.html)
  home:
    name: Prajwal Chauhan
    role: PhD student · NYU Tandon
    avatar: assets/profile.jpg
    cv:
      name: CV
      link: Prajwal_Chauhan_resume_DS.pdf
    topic_icons:
      Machine Learning: material/brain
      Mathematics: material/sigma
      Reinforcement Learning: material/robot-outline
      Traffic Flow: material/car-multiple

extra_javascript:
  - js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - js/ui.js

extra_css:
  - css/justify.css
  - css/theme.css
