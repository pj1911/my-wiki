name: deploy mkdocs
on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so each page can show its last-updated date

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Install MkDocs + Material + the last-updated plugin, pinned to the
      # versions the theme was built against (MkDocs 2.x drops Material support)
      - name: Install MkDocs
        run: |
          pip install --upgrade pip
          pip install "mkdocs==1.6.1" "mkdocs-material==9.8.0" "mkdocs-git-revision-date-localized-plugin==1.6.2"

      # Configure git identity for gh-deploy pushes
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Build & deploy to gh-pages
      - name: Deploy with MkDocs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdocs gh-deploy --force --clean --verbose
